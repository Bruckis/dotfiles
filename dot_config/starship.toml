"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_macchiato"
add_newline = false
format = """\
  $username$hostname󰣇 \
  $directory\
  $git_branch$git_commit$git_state $git_status\
  $cmd_duration$character\n
"""
right_format = """
$singularity\
$kubernetes\
$vcsh\
$hg_branch\
$pijul_channel\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$zig\
$buf\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$time"""

continuation_prompt = '▶▶ '


# style_choices:
# bold
# italic
# underline
# dimmed
# inverted
# blink
# hidden
# strikethrough
# bg:<color>
# fg:<color>
# <color>
# none

# NOTE: you can customize the symbol(s, e.g:
# [character]
# success_symbol = "[  ]($bold fg:#f8f8f2)"
# error_symbol = "[ ➤ ]($bold fg:#fb4934)"

[directory]
disabled = false
format = "[$path](bold sapphire)"
truncate_to_repo = false
# home_symbol = "" 

[git_branch]
format = " [  $branch](overlay2)"

[git_status]
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = '[[( $all_status$ahead_behind )](blue)]($style)'
style = "bg:surface0"


[time]
disabled = false
format = '[[  $time ](subtext0)]($style)'
time_format = "%R"                            # Hour:Minute Format

[deno]
format = " [deno](italic) [ $version](green bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
style = "bold bright-yellow"
symbol = "⨀ "
version_format = "${raw}"

[nodejs]
detect_extensions = []
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
format = "[ ](bold bright-green)"
version_format = "${raw}"

[python]
format = "[${symbol}(${virtualenv}) ${version}]($style)"
style = "bold bright-yellow"
symbol = "[ ](bold bright-blue)"
version_format = "${raw}"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
style = "bold red"
symbol = " "
version_format = "${raw}"

[rust]
format = " rs $symbol"
symbol = " "

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
style = "bold bright-red"
symbol = " "
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold blue"
symbol = " "

[buf]
format = " [buf](italic) [$symbol $version $buf_version]($style)"
symbol = "■ "

[c]
format = " [$symbol($version(-$name))]($style)"
symbol = "ℂ "

[conda]
format = " conda [$symbol$environment]($style)"
symbol = "◯ "

[dart]
format = " dart [$symbol($version )]($style)"
symbol = " "


[elixir]
format = " exs [$symbol $version OTP $otp_version ]($style)"
symbol = " "

[elm]
format = " elm [$symbol($version )]($style)"
symbol = "◩ "

[golang]
format = " go [$symbol($version )]($style)"
symbol = "∩ "

[haskell]
format = " hs [$symbol($version )]($style)"
symbol = "❯λ "

[java]
format = " java [${symbol}(${version} )]($style)"
symbol = " "

[julia]
format = " jl [$symbol($version )]($style)"
symbol = "◎ "

[memory_usage]
format = " mem [${ram}( ${swap})]($style)"
symbol = "▪▫▪ "

[nim]
format = " nim [$symbol($version )]($style)"
symbol = "▴▲▴ "

[nix_shell]
format = '[$symbol nix⎪$state⎪]($style) [$name](italic dimmed white)'
impure_msg = '[⌽](bold dimmed red)'
pure_msg = '[⌾](bold dimmed green)'
style = 'bold italic dimmed blue'
symbol = ' '
unknown_msg = '[◌](bold dimmed yellow)'

[spack]
format = " spack [$symbol$environment]($style)"
symbol = "◇ "


[zig]
format = " zig [$symbol]($style)"
symbol = " "


[scala]
format = " scala [$symbol]($style)"
symbol = " "


# Only shown over SSH (default behaviour), so you can tell which box you are on.
[username]
format = "[$user]($style)@"
style_user = "bold mauve"

[hostname]
format = "[$hostname]($style) "
style = "bold peach"

# How long the last command took, if over 2 s (like p10k did).
[cmd_duration]
format = "[ $duration]($style) "
style = "yellow"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
