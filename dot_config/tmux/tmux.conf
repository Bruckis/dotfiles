# ~/.config/tmux/tmux.conf
# Based on dreamsofcode-io/tmux, cleaned up.

# Terminal and colours
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-kitty:RGB,alacritty:RGB"
set -g allow-passthrough on        # kitty image previews (fastfetch logo etc.)
set -g set-clipboard on            # OSC 52: copy to the local clipboard, even over SSH

# General
set -g mouse on
set -g base-index 1                # windows start at 1
set -g pane-base-index 1           # panes start at 1
set -g renumber-windows on         # close window 2 of 3 -> 3 becomes 2
set -g history-limit 50000
set -g status-position top

# Prefix: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits and new windows open in the current folder
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Panes: Ctrl+h/j/k/l (vim-tmux-navigator, also moves between nvim splits)
# Ctrl+L is taken by that, so prefix + Ctrl+L clears the screen instead.
bind C-l send-keys C-l
# Resize panes: prefix + H/J/K/L (hold-repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows: Shift+Left/Right or Alt+Shift+H/L, no prefix
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# Copy mode: vi keys (prefix + [ to enter)
set -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# Theme: Catppuccin (cloned by chezmoi, not TPM, as upstream recommends)
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"

# Plugins (TPM). prefix + I installs, prefix + U updates.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Keep this line last.
run ~/.config/tmux/plugins/tpm/tpm
